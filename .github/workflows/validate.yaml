name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUSKY: "0"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.8.0
      - name: Install dependencies and generate fonts
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm typecheck
      - name: Verify generated fonts
        run: pnpm fonts:check
      - name: Run unit and build tests
        run: pnpm test
      - name: Build and audit real content
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:browser --workers=2
